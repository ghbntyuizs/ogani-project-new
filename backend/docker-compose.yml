# Tuỳ chọn: chạy PostgreSQL (và app) bằng Docker. Nếu bạn đã có PostgreSQL + pgAdmin trên máy thì KHÔNG cần file này.
services:
  mailpit:
    image: axllent/mailpit:latest
    profiles: [mail]
    ports: ["127.0.0.1:1025:1025", "127.0.0.1:8025:8025"]
    environment:
      MP_MAX_MESSAGES: 100
      MP_DISABLE_VERSION_CHECK: "true"
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: ogani_store
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports: ["5433:5432"]            # 5433 để không đụng PostgreSQL cài sẵn trên máy (5432)
    volumes: [db_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ogani_store"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build: .
    depends_on:
      db: { condition: service_healthy }
    environment:
      DB_URL: jdbc:postgresql://db:5432/ogani_store
      DB_USER: postgres
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET to a random secret of at least 32 characters}
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_AUTH: ${SMTP_AUTH:-false}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-false}
      SMTP_SSL: ${SMTP_SSL:-false}
      SMTP_FROM: ${SMTP_FROM:-no-reply@ogani.local}
      PASSWORD_RESET_URL: ${PASSWORD_RESET_URL:-http://localhost:8080/reset-password.html}
      APP_UPLOAD_DIRECTORY: /app/uploads
      APP_UPLOAD_PUBLIC_ORIGIN: ${UPLOAD_PUBLIC_ORIGIN:-http://localhost:8080}
    volumes:
      - uploads_data:/app/uploads
    ports: ["8080:8080"]

volumes:
  db_data:
  uploads_data:
