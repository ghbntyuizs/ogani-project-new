# Profile "test": dùng cho các class *IT (AbstractIntegrationTest bật bằng @ActiveProfiles("test")).
# Trỏ vào database riêng để test không đụng dữ liệu dev. Tạo database 1 lần:  CREATE DATABASE ogani_store_test;
# Đổi user/mật khẩu/URL bằng biến môi trường TEST_DB_URL, TEST_DB_USER, TEST_DB_PASSWORD (không cần sửa file này).
spring:
  datasource:
    url: ${TEST_DB_URL:jdbc:postgresql://localhost:5432/ogani_store_test}
    username: ${TEST_DB_USER:postgres}
    password: ${TEST_DB_PASSWORD:${DB_PASSWORD:postgres}}

app:
  maintenance:
    enabled: false
  jwt:
    secret: test-only-secret-not-for-deployment-123456789
