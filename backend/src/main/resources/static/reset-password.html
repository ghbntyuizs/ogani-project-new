<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; connect-src 'self'; form-action 'self'; base-uri 'none'">
  <title>Đặt lại mật khẩu — Ogani</title>
  <link rel="stylesheet" href="/password-reset.css">
  <script src="/password-reset.js" defer></script>
</head>
<body>
  <main>
    <h1>Đặt lại mật khẩu</h1>
    <p>Nhập mật khẩu mới cho tài khoản của bạn.</p>
    <p id="message" role="status" aria-live="polite" hidden></p>
    <form id="reset-form">
      <label for="new-password">Mật khẩu mới</label>
      <input id="new-password" name="newPassword" type="password" autocomplete="new-password" minlength="6" maxlength="72" required>
      <label for="confirm-password">Nhập lại mật khẩu mới</label>
      <input id="confirm-password" name="confirmPassword" type="password" autocomplete="new-password" minlength="6" maxlength="72" required>
      <p class="hint">Dùng ít nhất 6 ký tự và chọn mật khẩu khác mật khẩu cũ.</p>
      <button type="submit">Lưu mật khẩu mới</button>
    </form>
    <noscript>Vui lòng bật JavaScript để sử dụng liên kết đặt lại mật khẩu.</noscript>
  </main>
</body>
</html>
