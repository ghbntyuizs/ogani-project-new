spring:
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:1025}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    default-encoding: UTF-8
    properties:
      "[mail.smtp.auth]": ${SMTP_AUTH:false}
      "[mail.smtp.starttls.enable]": ${SMTP_STARTTLS:false}
      "[mail.smtp.starttls.required]": ${SMTP_STARTTLS:false}
      "[mail.smtp.ssl.enable]": ${SMTP_SSL:false}
      "[mail.smtp.connectiontimeout]": 5000
      "[mail.smtp.timeout]": 3000
      "[mail.smtp.writetimeout]": 5000
  profiles:
    active: local
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  application:
    name: ogani-store
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/ogani_store}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:123456}
  jpa:
    open-in-view: false          # tránh lazy-load ngầm ở tầng controller
    hibernate:
      ddl-auto: none             # schema do Flyway quản lý, Hibernate không tự sửa
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true

server:
  port: 8080

app:
  password-reset:
    ttl-minutes: ${RESET_TTL_MINUTES:15}
    email-limit: ${RESET_EMAIL_LIMIT:3}
    ip-limit: ${RESET_IP_LIMIT:20}
    reset-ip-limit: ${RESET_ATTEMPT_LIMIT:50}
    window-minutes: ${RESET_WINDOW_MINUTES:15}
    cooldown-seconds: ${RESET_COOLDOWN_SECONDS:60}
    reset-url: ${PASSWORD_RESET_URL:http://localhost:8080/reset-password.html}
    from: ${SMTP_FROM:no-reply@ogani.local}
  jwt:
    secret: ${JWT_SECRET:}
    access-ttl-minutes: 15
    refresh-ttl-days: 7
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:5500,http://127.0.0.1:5500,http://localhost:3000,http://localhost:8080}

management:
  endpoints:
    web:
      exposure:
        include: health

springdoc:
  swagger-ui:
    path: /swagger-ui.html
